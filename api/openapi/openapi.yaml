openapi: 3.1.0
info:
  title: MedLink SA API
  version: 0.7.0
  summary: JSON API served by the MedLink SA Next.js app (web/src/app/api).
  description: |
    Documents only the endpoints that are implemented. Conventions (envelope,
    error codes, auth, caching, rate limits) are in api/docs/conventions.md.

    Every response carries an `x-request-id` header (echoed when the client sends a
    valid one) and errors include the same value as `requestId`.
servers:
  - url: http://localhost:3000
    description: Local development (cd web && npm run dev)
tags:
  - name: Profile
    description: The signed-in user's own profile.
  - name: Settings
    description: The signed-in user's own app settings.
  - name: Directory
    description: Public facility and practitioner directory (no sign-in required).
  - name: Appointments
    description: |
      The signed-in user's own appointments (patient scope). Times are ISO 8601 instants:
      send them with an offset (SAST is +02:00, no DST); responses are UTC (`Z`).
  - name: Queues
    description: |
      Virtual queues. A queue is one facility's tickets for one day (South African date,
      Africa/Johannesburg); there is no separate queue object. Patients can join, see
      and leave their own tickets. Calling, serving and reordering tickets are staff
      operations and are not available. No wait-time estimates are provided.
  - name: Medicines
    description: |
      Public medicine directory (no sign-in required). The current rows are DEMO data
      (`source: demo`) seeded from the app's demo products; demo prices are illustrative
      and not current. There is no description, dosage guidance, stock or availability
      data.
  - name: Prescriptions
    description: |
      The signed-in patient's own prescriptions, read-only. Prescriptions are written by
      prescribers; there is no prescriber workflow in this API yet, so nothing here
      creates, edits, signs, dispenses, renews or changes the status of a prescription.
  - name: MedicalRecords
    description: |
      The signed-in patient's own medical records. Records are patient-authored (the
      patient types them in, as on the Android Records screen): `provider` is free text
      and is not verified. There are no attachments or files. Records can't be edited
      or deleted through this API.

# Private by default; public operations override with `security: []`.
security:
  - cookieSession: []
  - bearerAuth: []

paths:
  /api/profile:
    get:
      tags: [Profile]
      operationId: getProfile
      summary: Get my profile
      responses:
        "200":
          description: The caller's profile.
          headers:
            x-request-id: { $ref: "#/components/headers/RequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Profile" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    patch:
      tags: [Profile]
      operationId: updateProfile
      summary: Update my name and/or phone
      description: |
        Only `fullName` and `phone` are editable. `email` changes go through Supabase
        Auth; `role`, `id` and timestamps are database-owned. Any other field is a 400.
        Cookie-authenticated requests must be same-origin. Limited to 20 writes per
        user per minute per server instance.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileUpdate" }
            example: { fullName: Thandiwe Mokoena, phone: "+27 82 123 4567" }
      responses:
        "200":
          description: The updated profile.
          headers:
            x-request-id: { $ref: "#/components/headers/RequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Profile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/settings:
    get:
      tags: [Settings]
      operationId: getSettings
      summary: Get my settings
      responses:
        "200":
          description: The caller's settings.
          headers:
            x-request-id: { $ref: "#/components/headers/RequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Settings" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    patch:
      tags: [Settings]
      operationId: updateSettings
      summary: Update my settings
      description: A missing settings row is 404 SETTINGS_NOT_FOUND; it is never created here.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SettingsUpdate" }
            example: { language: zu, theme: dark }
      responses:
        "200":
          description: The updated settings.
          headers:
            x-request-id: { $ref: "#/components/headers/RequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Settings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/facilities:
    get:
      tags: [Directory]
      operationId: listFacilities
      summary: List facilities (public)
      description: |
        Public. A session, if sent, is ignored. Ordered by name, then id. Unknown or
        repeated query parameters are a 400.
      security: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: type
          in: query
          schema: { $ref: "#/components/schemas/FacilityType" }
        - name: province
          in: query
          description: Exact, case-sensitive match (uses the province index), e.g. `Gauteng`.
          schema: { type: string, minLength: 1, maxLength: 50 }
        - name: city
          in: query
          description: Case-insensitive exact match.
          schema: { type: string, minLength: 1, maxLength: 100 }
        - $ref: "#/components/parameters/NameSearch"
      responses:
        "200":
          description: One page of facilities.
          headers:
            x-request-id: { $ref: "#/components/headers/RequestId" }
            Cache-Control: { $ref: "#/components/headers/PublicCacheControl" }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Facility" }
                  meta: { $ref: "#/components/schemas/PageMeta" }
              example:
                data:
                  - id: 3f2b8c1e-7d4a-4e5b-9c6d-1a2b3c4d5e6f
                    name: Chris Hani Baragwanath Hospital
                    type: hospital
                    province: Gauteng
                    city: Soweto
                    address: 26 Chris Hani Rd
                    phone: "+27 11 933 8000"
                    latitude: -26.2605
                    longitude: 27.9433
                meta: { page: 1, pageSize: 20, total: 1, totalPages: 1 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/facilities/{id}:
    get:
      tags: [Directory]
      operationId: getFacility
      summary: Get a facility (public)
      security: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The facility.
          headers:
            x-request-id: { $ref: "#/components/headers/RequestId" }
            Cache-Control: { $ref: "#/components/headers/PublicCacheControl" }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Facility" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/practitioners:
    get:
      tags: [Directory]
      operationId: listPractitioners
      summary: List practitioners (public)
      description: |
        Public directory fields only. `profileId` and `licenseNumber` are never
        returned. Ordered by fullName, then id.
      security: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: facilityId
          in: query
          schema: { type: string, format: uuid }
        - name: specialty
          in: query
          description: Case-insensitive exact match, e.g. `cardiology`.
          schema: { type: string, minLength: 1, maxLength: 100 }
        - $ref: "#/components/parameters/NameSearch"
      responses:
        "200":
          description: One page of practitioners.
          headers:
            x-request-id: { $ref: "#/components/headers/RequestId" }
            Cache-Control: { $ref: "#/components/headers/PublicCacheControl" }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Practitioner" }
                  meta: { $ref: "#/components/schemas/PageMeta" }
              example:
                data:
                  - id: 8a7b6c5d-4e3f-4a1b-8c9d-0e1f2a3b4c5d
                    fullName: Dr Sipho Dlamini
                    specialty: Cardiology
                    facilityId: 3f2b8c1e-7d4a-4e5b-9c6d-1a2b3c4d5e6f
                    facility: { id: 3f2b8c1e-7d4a-4e5b-9c6d-1a2b3c4d5e6f, name: Chris Hani Baragwanath Hospital }
                meta: { page: 1, pageSize: 20, total: 1, totalPages: 1 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/practitioners/{id}:
    get:
      tags: [Directory]
      operationId: getPractitioner
      summary: Get a practitioner (public)
      security: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The practitioner.
          headers:
            x-request-id: { $ref: "#/components/headers/RequestId" }
            Cache-Control: { $ref: "#/components/headers/PublicCacheControl" }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Practitioner" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/appointments:
    get:
      tags: [Appointments]
      operationId: listAppointments
      summary: List my appointments
      description: |
        Only the caller's appointments. Ordered by scheduledAt, then id. `from` is
        inclusive and `to` exclusive; both need a UTC offset. Unknown or repeated query
        parameters are a 400.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/AppointmentStatus" }
        - name: from
          in: query
          description: Earliest scheduledAt (inclusive), e.g. `2026-10-20T00:00:00+02:00`.
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: Latest scheduledAt (exclusive). Must be after `from`.
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: One page of the caller's appointments.
          headers:
            x-request-id: { $ref: "#/components/headers/RequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Appointment" }
                  meta: { $ref: "#/components/schemas/PageMeta" }
              example:
                data:
                  - id: a1a1a1a1-b2b2-4c3c-8d4d-e5e5e5e5e5e5
                    practitionerId: 8a7b6c5d-4e3f-4a1b-8c9d-0e1f2a3b4c5d
                    practitionerName: Dr Sipho Dlamini
                    specialty: Cardiology
                    facilityId: 3f2b8c1e-7d4a-4e5b-9c6d-1a2b3c4d5e6f
                    facilityName: Chris Hani Baragwanath Hospital
                    scheduledAt: "2026-10-20T07:30:00.000Z"
                    reason: Check-up
                    status: confirmed
                    createdAt: "2026-10-19T08:00:00.000Z"
                    updatedAt: "2026-10-19T09:15:00.000Z"
                meta: { page: 1, pageSize: 20, total: 1, totalPages: 1 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      tags: [Appointments]
      operationId: createAppointment
      summary: Request an appointment
      description: |
        Books the caller (from the session) with a directory practitioner at the
        practitioner's facility. Practitioner name, specialty and facility name are
        copied from the directory; status starts as `requested` (database default).
        patientId, status, names and timestamps are rejected (400).

        `scheduledAt` must have a UTC offset, be on a whole minute, be in the future and
        be at most 365 days ahead. A 409 is returned if the practitioner, or the caller,
        already has a requested/confirmed appointment starting at the same instant
        (there is no duration, so only identical start times are detected).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppointmentCreate" }
            example:
              practitionerId: 8a7b6c5d-4e3f-4a1b-8c9d-0e1f2a3b4c5d
              scheduledAt: "2026-10-20T09:30:00+02:00"
              reason: Check-up
      responses:
        "201":
          description: The new appointment.
          headers:
            x-request-id: { $ref: "#/components/headers/RequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Appointment" }
              examples:
                created: { $ref: "#/components/examples/AppointmentRequestedEnvelope" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/AppointmentConflict" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/appointments/{id}:
    get:
      tags: [Appointments]
      operationId: getAppointment
      summary: Get one of my appointments
      description: Another patient's appointment returns the same 404 as a missing one.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The appointment.
          headers:
            x-request-id: { $ref: "#/components/headers/RequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Appointment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    patch:
      tags: [Appointments]
      operationId: updateAppointment
      summary: Change the reason or reschedule
      description: |
        Only upcoming `requested` or `confirmed` appointments can change (else 409
        APPOINTMENT_NOT_EDITABLE).
        - `reason`: editable while requested or confirmed; `null` clears it.
        - `scheduledAt`: only while `requested` (a confirmed appointment must be
          cancelled and re-requested), validated like creation, conflict-checked (409).
        Status, practitioner, facility, patient and timestamps are rejected (400).
        Sending the current scheduledAt is a no-op.
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppointmentUpdate" }
            example: { scheduledAt: "2026-10-21T14:00:00+02:00", reason: Follow-up }
      responses:
        "200":
          description: The updated appointment.
          headers:
            x-request-id: { $ref: "#/components/headers/RequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Appointment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/AppointmentConflict" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/appointments/{id}/cancel:
    post:
      tags: [Appointments]
      operationId: cancelAppointment
      summary: Cancel one of my appointments
      description: |
        `requested` or `confirmed`, still upcoming -> `cancelled`.
        Already `cancelled`: 200 with the appointment unchanged (safe to retry).
        `completed`, or the time has passed: 409 APPOINTMENT_NOT_CANCELLABLE.
        Takes no body (an empty body or `{}`); any field is a 400.
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: false, maxProperties: 0 }
      responses:
        "200":
          description: The cancelled appointment.
          headers:
            x-request-id: { $ref: "#/components/headers/RequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Appointment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/AppointmentConflict" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/medical-records:
    get:
      tags: [MedicalRecords]
      operationId: listMedicalRecords
      summary: List my medical records
      description: |
        Only the caller's records. Ordered by recordedOn (newest first), then createdAt
        (newest first), then id. `from` and `to` are inclusive calendar dates. Unknown
        or repeated query parameters (including `patientId`) are a 400.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: category
          in: query
          description: Exact category, case-insensitive (trimmed, 1-80 characters).
          schema: { type: string, minLength: 1, maxLength: 80 }
        - name: from
          in: query
          description: Earliest recordedOn (inclusive), `YYYY-MM-DD`, not before 1900-01-01.
          schema: { type: string, format: date }
        - name: to
          in: query
          description: Latest recordedOn (inclusive), `YYYY-MM-DD`. Must not be before `from`.
          schema: { type: string, format: date }
      responses:
        "200":
          description: One page of the caller's records.
          headers:
            x-request-id: { $ref: "#/components/headers/RequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/MedicalRecord" }
                  meta: { $ref: "#/components/schemas/PageMeta" }
              example:
                data:
                  - id: c3c3c3c3-d4d4-4e5e-8f6f-a7a7a7a7a7a7
                    title: Blood test
                    category: Lab result
                    provider: Lancet Laboratories
                    recordedOn: "2026-10-15"
                    notes: Cholesterol slightly high
                    createdAt: "2026-10-19T10:00:00.000Z"
                    updatedAt: "2026-10-19T10:00:00.000Z"
                meta: { page: 1, pageSize: 20, total: 1, totalPages: 1 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      tags: [MedicalRecords]
      operationId: createMedicalRecord
      summary: Add a medical record (patients only)
      description: |
        Adds a record for the caller (from the session). Only users whose profile role
        is `patient` may add records (403 otherwise). patientId, id, timestamps and any
        other field are rejected (400). `recordedOn` is a calendar date, not before
        1900-01-01 and not after today's date in South Africa (Africa/Johannesburg).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MedicalRecordCreate" }
            example:
              title: Blood test
              category: Lab result
              provider: Lancet Laboratories
              recordedOn: "2026-10-15"
              notes: Cholesterol slightly high
      responses:
        "201":
          description: The new record.
          headers:
            x-request-id: { $ref: "#/components/headers/RequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/MedicalRecord" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/medical-records/{id}:
    get:
      tags: [MedicalRecords]
      operationId: getMedicalRecord
      summary: Get one of my medical records
      description: Another patient's record returns the same 404 as a missing one. Query parameters are a 400.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The record.
          headers:
            x-request-id: { $ref: "#/components/headers/RequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/MedicalRecord" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/queues:
    get:
      tags: [Queues]
      operationId: listQueues
      summary: List the queues I can join today
      description: |
        One queue per facility for today's South African date. Same filters and order as
        `GET /api/facilities` (name, then id). No patient data, queue length or wait
        estimate. Unknown or repeated query parameters are a 400.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: type
          in: query
          schema: { $ref: "#/components/schemas/FacilityType" }
        - name: province
          in: query
          description: Exact, case-sensitive match, e.g. `Gauteng`.
          schema: { type: string, minLength: 1, maxLength: 50 }
        - name: city
          in: query
          description: Case-insensitive exact match.
          schema: { type: string, minLength: 1, maxLength: 100 }
        - $ref: "#/components/parameters/NameSearch"
      responses:
        "200":
          description: One page of queues.
          headers:
            x-request-id: { $ref: "#/components/headers/RequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Queue" }
                  meta: { $ref: "#/components/schemas/PageMeta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/queues/{id}/join:
    post:
      tags: [Queues]
      operationId: joinQueue
      summary: Join today's queue at a facility (patients only)
      description: |
        `id` is the facility id. Issues a ticket for the caller (from the session) for
        today's South African date with the next ticket number at that facility; status
        starts as `waiting`. No body, or `{}`; any field (patientId, status,
        ticketNumber, position, timestamps...) is a 400. Only users whose profile role is
        `patient` may join (403 otherwise). A patient can hold one active (waiting or
        called) ticket per day across all facilities: a second join is a 409
        QUEUE_TICKET_ACTIVE. Every facility accepts tickets (the schema has no opening
        hours or open/closed flag).
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmptyBody" }
      responses:
        "201":
          description: The new ticket.
          headers:
            x-request-id: { $ref: "#/components/headers/RequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/QueueTicket" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/QueueConflict" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/queue-tickets:
    get:
      tags: [Queues]
      operationId: listQueueTickets
      summary: List my queue tickets
      description: |
        Only the caller's tickets. Ordered by serviceDate (newest first), then issuedAt
        (newest first), then id. Unknown or repeated query parameters are a 400.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/QueueTicketStatus" }
      responses:
        "200":
          description: One page of the caller's tickets.
          headers:
            x-request-id: { $ref: "#/components/headers/RequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/QueueTicket" }
                  meta: { $ref: "#/components/schemas/PageMeta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/queue-tickets/{id}:
    get:
      tags: [Queues]
      operationId: getQueueTicket
      summary: Get one of my queue tickets
      description: Another patient's ticket returns the same 404 as a missing one. Query parameters are a 400.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The ticket.
          headers:
            x-request-id: { $ref: "#/components/headers/RequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/QueueTicket" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/queue-tickets/{id}/leave:
    post:
      tags: [Queues]
      operationId: leaveQueue
      summary: Leave a queue
      description: |
        A waiting or called ticket for today becomes `cancelled`. Leaving an
        already-cancelled ticket returns it unchanged (200, safe to retry). A served
        ticket, or one for an earlier day, is a 409 QUEUE_TICKET_NOT_LEAVABLE. Ticket
        numbers are never changed. No body, or `{}`.
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmptyBody" }
      responses:
        "200":
          description: The ticket, now cancelled.
          headers:
            x-request-id: { $ref: "#/components/headers/RequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/QueueTicket" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/QueueConflict" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/prescriptions:
    get:
      tags: [Prescriptions]
      operationId: listPrescriptions
      summary: List my prescriptions
      description: |
        Only the caller's prescriptions, without items (see `itemCount`; items are in the
        detail response). Ordered by issuedOn (newest first), then createdAt (newest
        first), then id. `from` and `to` filter issuedOn and are inclusive. Unknown or
        repeated query parameters (including `patientId`) are a 400.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/PrescriptionStatus" }
        - name: from
          in: query
          description: Earliest issuedOn (inclusive), `YYYY-MM-DD`, not before 1900-01-01.
          schema: { type: string, format: date }
        - name: to
          in: query
          description: Latest issuedOn (inclusive), `YYYY-MM-DD`. Must not be before `from`.
          schema: { type: string, format: date }
      responses:
        "200":
          description: One page of the caller's prescriptions.
          headers:
            x-request-id: { $ref: "#/components/headers/RequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/PrescriptionSummary" }
                  meta: { $ref: "#/components/schemas/PageMeta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/prescriptions/{id}:
    get:
      tags: [Prescriptions]
      operationId: getPrescription
      summary: Get one of my prescriptions, with its items
      description: Another patient's prescription returns the same 404 as a missing one. Query parameters are a 400.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The prescription and its items.
          headers:
            x-request-id: { $ref: "#/components/headers/RequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Prescription" }
              example:
                data:
                  id: b1b1b1b1-c2c2-4d3d-8e4e-f5f5f5f5f5f5
                  status: active
                  issuedOn: "2026-10-19"
                  expiresOn: "2027-04-19"
                  notes: Take with food
                  practitioner: { fullName: Dr Sipho Dlamini, specialty: General practice }
                  facility: { id: 3f2b8c1e-7d4a-4e5b-9c6d-1a2b3c4d5e6f, name: Rosebank Clinic }
                  itemCount: 1
                  createdAt: "2026-10-19T08:00:00.000Z"
                  updatedAt: "2026-10-19T08:00:00.000Z"
                  items:
                    - id: c1c1c1c1-d2d2-4e3e-8f4f-a5a5a5a5a5a5
                      medicineName: Metformin 850mg
                      dosage: 1 tablet twice daily
                      quantity: 60
                      instructions: null
                      refills: 2
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/medicines:
    get:
      tags: [Medicines]
      operationId: listMedicines
      summary: List medicines (public)
      description: |
        Public. A session, if sent, is ignored. Active medicines only, ordered by name,
        then id. Unknown or repeated query parameters are a 400.
      security: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/NameSearch"
        - name: category
          in: query
          description: Case-insensitive exact match, e.g. `Antibiotic`.
          schema: { type: string, minLength: 1, maxLength: 80 }
        - name: requiresPrescription
          in: query
          schema: { type: string, enum: ["true", "false"] }
      responses:
        "200":
          description: One page of medicines.
          headers:
            x-request-id: { $ref: "#/components/headers/RequestId" }
            Cache-Control: { $ref: "#/components/headers/PublicCacheControl" }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Medicine" }
                  meta: { $ref: "#/components/schemas/PageMeta" }
              example:
                data:
                  - id: d1d1d1d1-e2e2-4f3f-8a4a-b5b5b5b5b5b5
                    name: Panado
                    genericName: Paracetamol
                    strength: 500mg
                    form: Tablet
                    category: Pain & fever
                    requiresPrescription: false
                    source: demo
                meta: { page: 1, pageSize: 20, total: 1, totalPages: 1 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/medicines/{id}:
    get:
      tags: [Medicines]
      operationId: getMedicine
      summary: Get a medicine (public)
      description: Public. An inactive or unknown medicine is a 404. Query parameters are a 400.
      security: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The medicine.
          headers:
            x-request-id: { $ref: "#/components/headers/RequestId" }
            Cache-Control: { $ref: "#/components/headers/PublicCacheControl" }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Medicine" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/medicines/{id}/prices:
    get:
      tags: [Medicines]
      operationId: listMedicinePrices
      summary: List a medicine's listed prices (public)
      description: |
        Public. Prices per named pharmacy, newest `effectiveFrom` first, then pharmacy
        name, then id. Demo prices (`source: demo`) are illustrative, NOT current prices.
        Only `page` and `pageSize` are accepted.
      security: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: One page of prices.
          headers:
            x-request-id: { $ref: "#/components/headers/RequestId" }
            Cache-Control: { $ref: "#/components/headers/PublicCacheControl" }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/MedicinePrice" }
                  meta: { $ref: "#/components/schemas/PageMeta" }
              example:
                data:
                  - id: e7e7e7e7-f8f8-4a9a-8b0b-c1c1c1c1c1c1
                    pharmacyName: Clicks
                    amount: "24.99"
                    currency: ZAR
                    effectiveFrom: "2026-10-19"
                    source: demo
                meta: { page: 1, pageSize: 20, total: 1, totalPages: 1 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

components:
  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: sb-<project-ref>-auth-token
      description: |
        Supabase session cookie set by the web app's sign-in (may be split into
        `.0`, `.1` chunks). Used automatically by same-site browser requests.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase access token (for the Android app and other clients). Takes precedence over cookies.

  headers:
    RequestId:
      description: Request correlation id (generated, or echoed if the client sent a valid one).
      schema: { type: string }
    NoStore:
      description: Private responses are never cached.
      schema: { type: string, example: no-store }
    PublicCacheControl:
      description: Successful directory responses only. Errors and private endpoints are `no-store`.
      schema: { type: string, example: "public, max-age=60, s-maxage=300" }

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      description: 1-based page number.
      schema: { type: integer, minimum: 1, maximum: 1000, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    NameSearch:
      name: q
      in: query
      description: Case-insensitive "contains" search on the name (trimmed).
      schema: { type: string, minLength: 2, maxLength: 100 }

  schemas:
    AppointmentStatus:
      type: string
      enum: [requested, confirmed, completed, cancelled]
      description: New appointments are `requested`. Patients can only cancel; confirming and completing are not available through this API.
    Appointment:
      type: object
      required: [id, practitionerId, practitionerName, specialty, facilityId, facilityName, scheduledAt, reason, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        practitionerId:
          type: [string, "null"]
          format: uuid
          description: null if the practitioner was later removed from the directory.
        practitionerName: { type: string, maxLength: 100, description: Copied from the directory at booking. }
        specialty: { type: string, maxLength: 100 }
        facilityId:
          type: [string, "null"]
          format: uuid
          description: null if the facility was later removed.
        facilityName: { type: string, maxLength: 150 }
        scheduledAt: { type: string, format: date-time, description: UTC instant (`Z`). }
        reason: { type: [string, "null"], maxLength: 500 }
        status: { $ref: "#/components/schemas/AppointmentStatus" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AppointmentCreate:
      type: object
      additionalProperties: false
      required: [practitionerId, scheduledAt]
      properties:
        practitionerId: { type: string, format: uuid }
        facilityId:
          type: string
          format: uuid
          description: Optional. Must be the practitioner's facility (400 otherwise; 404 if it doesn't exist).
        scheduledAt:
          type: string
          format: date-time
          description: With a UTC offset (`+02:00` or `Z`), seconds `00`, in the future, at most 365 days ahead.
        reason: { type: [string, "null"], minLength: 1, maxLength: 500, description: Trimmed. }
    AppointmentUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        scheduledAt:
          type: string
          format: date-time
          description: Same rules as creation. Only while the appointment is `requested`.
        reason: { type: [string, "null"], minLength: 1, maxLength: 500, description: Trimmed; null clears it. }
    Queue:
      type: object
      required: [id, name, type, province, city, serviceDate]
      properties:
        id: { type: string, format: uuid, description: The facility id (use it to join). }
        name: { type: string, maxLength: 150 }
        type: { $ref: "#/components/schemas/FacilityType" }
        province: { type: string, maxLength: 50 }
        city: { type: string, maxLength: 100 }
        serviceDate: { type: string, format: date, description: "Today's South African date: the day a ticket joined now is for." }
    QueueTicketStatus:
      type: string
      enum: [waiting, called, served, cancelled]
      description: New tickets are `waiting`. Patients can only leave (-> `cancelled`); `called` and `served` are set by staff, which this API doesn't offer.
    QueueTicket:
      type: object
      required: [id, facilityId, facilityName, serviceDate, ticketNumber, status, waitingAhead, issuedAt, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        facilityId: { type: string, format: uuid }
        facilityName: { type: string, maxLength: 150 }
        serviceDate: { type: string, format: date, description: South African calendar date the ticket is for. }
        ticketNumber: { type: integer, minimum: 1, description: Unique per facility and day; issued in order and never reused or changed. }
        status: { $ref: "#/components/schemas/QueueTicketStatus" }
        waitingAhead:
          type: [integer, "null"]
          minimum: 0
          description: Waiting tickets with a lower number at the same facility and day, counted when the response is built. null unless this ticket is waiting today. Not a time estimate.
        issuedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    EmptyBody:
      type: object
      additionalProperties: false
      description: No fields are accepted. The body may also be omitted.
    Medicine:
      type: object
      required: [id, name, genericName, strength, form, category, requiresPrescription, source]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 150 }
        genericName: { type: [string, "null"], maxLength: 150 }
        strength: { type: [string, "null"], maxLength: 50 }
        form: { type: [string, "null"], maxLength: 50 }
        category: { type: [string, "null"], maxLength: 80 }
        requiresPrescription: { type: boolean }
        source: { type: string, maxLength: 50, description: "Where the row came from: `demo` for the seeded demo data." }
    MedicinePrice:
      type: object
      required: [id, pharmacyName, amount, currency, effectiveFrom, source]
      properties:
        id: { type: string, format: uuid }
        pharmacyName: { type: string, maxLength: 100, description: "Pharmacy name as given by the source (free text, not a facility link)." }
        amount: { type: string, pattern: "^[0-9]+\\.[0-9]{2}$", description: 'Exact decimal amount with two decimals, e.g. `"24.99"`.' }
        currency: { type: string, pattern: "^[A-Z]{3}$", description: ISO 4217 code (`ZAR`). }
        effectiveFrom: { type: string, format: date }
        source: { type: string, maxLength: 50, description: "`demo` prices are illustrative, not current." }
    PrescriptionStatus:
      type: string
      enum: [active, completed, cancelled, expired]
      description: |
        Stored status. New prescriptions are `active`; `completed`, `cancelled` and
        `expired` are terminal. It is not recomputed from `expiresOn`, and this API never
        changes it.
    PrescriptionSummary:
      type: object
      required: [id, status, issuedOn, expiresOn, notes, practitioner, facility, itemCount, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/PrescriptionStatus" }
        issuedOn: { type: string, format: date }
        expiresOn: { type: [string, "null"], format: date, description: On or after issuedOn. }
        notes: { type: [string, "null"], maxLength: 1000 }
        practitioner:
          type: [object, "null"]
          description: Display only. null if no practitioner is linked or it was removed.
          required: [fullName, specialty]
          properties:
            fullName: { type: string, maxLength: 100 }
            specialty: { type: string, maxLength: 100 }
        facility:
          type: [object, "null"]
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string, maxLength: 150 }
        itemCount: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PrescriptionItem:
      type: object
      required: [id, medicineName, dosage, quantity, instructions, refills]
      properties:
        id: { type: string, format: uuid }
        medicineName: { type: string, maxLength: 150 }
        dosage: { type: string, maxLength: 100 }
        quantity: { type: [integer, "null"], minimum: 1 }
        instructions: { type: [string, "null"], maxLength: 500 }
        refills: { type: integer, minimum: 0 }
    Prescription:
      allOf:
        - $ref: "#/components/schemas/PrescriptionSummary"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              description: In the order they were added.
              items: { $ref: "#/components/schemas/PrescriptionItem" }
    MedicalRecord:
      type: object
      required: [id, title, category, provider, recordedOn, notes, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string, maxLength: 120 }
        category: { type: string, maxLength: 80, description: Free text chosen by the patient. }
        provider: { type: [string, "null"], maxLength: 150, description: Free text entered by the patient; not verified and not linked to the directory. }
        recordedOn: { type: string, format: date, description: Calendar date (`YYYY-MM-DD`). }
        notes: { type: [string, "null"], maxLength: 2000 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    MedicalRecordCreate:
      type: object
      additionalProperties: false
      required: [title, category, recordedOn]
      properties:
        title: { type: string, minLength: 1, maxLength: 120, description: Trimmed. }
        category: { type: string, minLength: 1, maxLength: 80, description: Trimmed. }
        provider: { type: [string, "null"], minLength: 1, maxLength: 150, description: Trimmed. Self-reported. }
        recordedOn: { type: string, format: date, description: "`YYYY-MM-DD`, from 1900-01-01 up to today's date in South Africa." }
        notes: { type: [string, "null"], minLength: 1, maxLength: 2000, description: Trimmed. }
    UserRole:
      type: string
      enum: [patient, doctor, pharmacy, hospital, admin]
    FacilityType:
      type: string
      enum: [hospital, clinic, community_health_centre, pharmacy]
    Profile:
      type: object
      required: [id, fullName, email, phone, role, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string, maxLength: 100 }
        email: { type: [string, "null"], format: email, maxLength: 254 }
        phone: { type: [string, "null"], maxLength: 32 }
        role: { $ref: "#/components/schemas/UserRole" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ProfileUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        fullName: { type: string, minLength: 1, maxLength: 100, description: Trimmed. }
        phone:
          type: [string, "null"]
          maxLength: 32
          pattern: "^\\+?[0-9() -]+$"
          description: 7-15 digits; null clears it.
    Settings:
      type: object
      required: [language, theme, notificationsEnabled, showEmergencyQr, updatedAt]
      properties:
        language: { type: string, enum: [en, zu, af, st] }
        theme: { type: string, enum: [system, light, dark] }
        notificationsEnabled: { type: boolean }
        showEmergencyQr: { type: boolean }
        updatedAt: { type: string, format: date-time }
    SettingsUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        language: { type: string, enum: [en, zu, af, st] }
        theme: { type: string, enum: [system, light, dark] }
        notificationsEnabled: { type: boolean }
        showEmergencyQr: { type: boolean }
    Facility:
      type: object
      required: [id, name, type, province, city, address, phone, latitude, longitude]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 150 }
        type: { $ref: "#/components/schemas/FacilityType" }
        province: { type: string, maxLength: 50 }
        city: { type: string, maxLength: 100 }
        address: { type: [string, "null"], maxLength: 250 }
        phone: { type: [string, "null"], maxLength: 32 }
        latitude:
          type: [number, "null"]
          minimum: -90
          maximum: 90
          description: Stored as decimal(9,6); returned as a number rounded to 6 decimal places.
        longitude:
          type: [number, "null"]
          minimum: -180
          maximum: 180
          description: Stored as decimal(9,6); returned as a number rounded to 6 decimal places.
    Practitioner:
      type: object
      description: Public directory fields only (profileId and licenseNumber are never exposed).
      required: [id, fullName, specialty, facilityId, facility]
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string, maxLength: 100 }
        specialty: { type: string, maxLength: 100 }
        facilityId: { type: [string, "null"], format: uuid }
        facility:
          oneOf:
            - type: object
              required: [id, name]
              properties:
                id: { type: string, format: uuid }
                name: { type: string }
            - type: "null"
    PageMeta:
      type: object
      required: [page, pageSize, total, totalPages]
      properties:
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
    ErrorIssue:
      type: object
      required: [path, code, message]
      properties:
        path: { type: string, description: Dot path of the field; empty for the whole body/query. }
        code: { type: string }
        message: { type: string }
        keys:
          type: array
          items: { type: string }
          description: Present for unrecognized_keys (the rejected field names).
    ErrorCode:
      type: string
      enum:
        - INVALID_JSON
        - INVALID_BODY
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - FORBIDDEN
        - NOT_FOUND
        - PROFILE_NOT_FOUND
        - SETTINGS_NOT_FOUND
        - FACILITY_NOT_FOUND
        - PRACTITIONER_NOT_FOUND
        - APPOINTMENT_NOT_FOUND
        - CONFLICT
        - APPOINTMENT_CONFLICT
        - APPOINTMENT_NOT_EDITABLE
        - APPOINTMENT_NOT_CANCELLABLE
        - MEDICAL_RECORD_NOT_FOUND
        - QUEUE_TICKET_NOT_FOUND
        - QUEUE_TICKET_ACTIVE
        - QUEUE_TICKET_NOT_LEAVABLE
        - PRESCRIPTION_NOT_FOUND
        - MEDICINE_NOT_FOUND
        - UNSUPPORTED_MEDIA_TYPE
        - RATE_LIMITED
        - INTERNAL_ERROR
        - SERVICE_UNAVAILABLE
    Error:
      type: object
      required: [error, requestId]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { $ref: "#/components/schemas/ErrorCode" }
            message: { type: string }
            details:
              type: array
              items: { $ref: "#/components/schemas/ErrorIssue" }
        requestId: { type: string }

  examples:
    AppointmentRequestedEnvelope:
      summary: A newly requested appointment
      value:
        data:
          id: a1a1a1a1-b2b2-4c3c-8d4d-e5e5e5e5e5e5
          practitionerId: 8a7b6c5d-4e3f-4a1b-8c9d-0e1f2a3b4c5d
          practitionerName: Dr Sipho Dlamini
          specialty: Cardiology
          facilityId: 3f2b8c1e-7d4a-4e5b-9c6d-1a2b3c4d5e6f
          facilityName: Chris Hani Baragwanath Hospital
          scheduledAt: "2026-10-20T07:30:00.000Z"
          reason: Check-up
          status: requested
          createdAt: "2026-10-19T08:00:00.000Z"
          updatedAt: "2026-10-19T08:00:00.000Z"

  responses:
    BadRequest:
      description: INVALID_JSON, INVALID_BODY or VALIDATION_FAILED (unknown/protected field, bad value, bad id, unknown or repeated query parameter).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error:
              code: VALIDATION_FAILED
              message: The query string is invalid.
              details: [{ path: pageSize, code: too_big, message: "Too big: expected number to be <=100" }]
            requestId: 6f0c1c9e-2b1a-4c1e-9d0f-3a2b1c0d9e8f
    Unauthenticated:
      description: No session, invalid/expired token, or malformed Authorization header.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: UNAUTHENTICATED, message: Sign in to continue. }, requestId: 6f0c1c9e-2b1a-4c1e-9d0f-3a2b1c0d9e8f }
    Forbidden:
      description: Cookie-authenticated write from another origin, or a profile role that may not perform the action.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: PROFILE_NOT_FOUND, SETTINGS_NOT_FOUND, FACILITY_NOT_FOUND, PRACTITIONER_NOT_FOUND, APPOINTMENT_NOT_FOUND, MEDICAL_RECORD_NOT_FOUND, QUEUE_TICKET_NOT_FOUND, PRESCRIPTION_NOT_FOUND or MEDICINE_NOT_FOUND.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: FACILITY_NOT_FOUND, message: No facility exists with that id. }, requestId: 6f0c1c9e-2b1a-4c1e-9d0f-3a2b1c0d9e8f }
    AppointmentConflict:
      description: |
        APPOINTMENT_CONFLICT (the practitioner or you already have an active appointment
        at that time), APPOINTMENT_NOT_EDITABLE or APPOINTMENT_NOT_CANCELLABLE.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error:
              code: APPOINTMENT_CONFLICT
              message: That time is not available with this practitioner. Choose another time.
              details: [{ path: scheduledAt, code: conflict, message: Time slot unavailable. }]
            requestId: 6f0c1c9e-2b1a-4c1e-9d0f-3a2b1c0d9e8f
    QueueConflict:
      description: |
        QUEUE_TICKET_ACTIVE (you already have a waiting or called ticket today),
        QUEUE_TICKET_NOT_LEAVABLE (served, or an earlier day's ticket) or CONFLICT.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UnsupportedMediaType:
      description: Write without Content-Type application/json.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Too many writes (per server instance). See Retry-After.
      headers:
        Retry-After:
          description: Seconds until the window resets.
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InternalError:
      description: Unexpected error. Generic message; details only in server logs (by requestId).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: INTERNAL_ERROR, message: Something went wrong. Please try again. }, requestId: 6f0c1c9e-2b1a-4c1e-9d0f-3a2b1c0d9e8f }
    ServiceUnavailable:
      description: Database or Supabase Auth unreachable.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
