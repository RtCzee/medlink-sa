name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (tests, build, types, lint, contract)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Matches the Node major the build was verified with locally (24.x).
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate
        env:
          # Placeholders: validate does not connect to a database.
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          DIRECT_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Unit tests (Vitest)
        # DB integration tests skip themselves unless MEDLINK_DB_INTEGRATION=1.
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      # Baseline-aware: the codebase has known pre-existing errors (tsc 15, eslint 6,
      # all in UI pages). These steps print every error and fail only if the count
      # goes ABOVE the baseline, so new errors are never hidden. Lower the numbers
      # as the old errors are fixed.
      - name: Type-check (fails above baseline of 15)
        run: |
          set +e
          npx tsc --noEmit > "$RUNNER_TEMP/tsc.txt" 2>&1
          set -e
          cat "$RUNNER_TEMP/tsc.txt"
          count=$(grep -c "error TS" "$RUNNER_TEMP/tsc.txt" || true)
          echo "tsc errors: $count (baseline 15)"
          test "$count" -le 15

      - name: Lint (fails above baseline of 6 errors)
        run: |
          npx eslint . || true
          npx eslint . --format json --output-file "$RUNNER_TEMP/eslint.json" || true
          count=$(node -e "const r=require(process.argv[1]);console.log(r.reduce((n,f)=>n+f.errorCount,0))" "$RUNNER_TEMP/eslint.json")
          echo "eslint errors: $count (baseline 6)"
          test "$count" -le 6

      - name: Validate OpenAPI contract
        working-directory: api
        run: npx --yes @redocly/cli@2 lint openapi/openapi.yaml

  android:
    name: Android (assembleDebug + unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          # JDK 21 matches the Android Studio JBR the build was verified with locally.
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          # Open-source caching provider (the default "enhanced" provider has separate license terms).
          cache-provider: basic

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build debug APK and run unit tests
        run: ./gradlew assembleDebug test --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: medlink-debug-apk
          path: mobile/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error